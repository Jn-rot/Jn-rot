<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="480" height="270" rx="16"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#round)">
    <rect width="480" height="270" fill="#101010"/>
    <rect width="480" height="34" fill="#1a1a1a"/>
    <line x1="0" y1="34" x2="480" y2="34" stroke="#2a2a2a"/>
    <circle cx="20" cy="17" r="4" fill="#ff5f56"/>
    <circle cx="36" cy="17" r="4" fill="#ffbd2e"/>
    <circle cx="52" cy="17" r="4" fill="#27c93f"/>
    <rect x="18" y="52" width="444" height="178" rx="10" fill="#151515" stroke="#282828"/>
    <path d="M18 196 H462" stroke="#9ca3af" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="52" y="176" width="96" height="18" fill="#2b2b2b"/>
    <rect x="212" y="150" width="84" height="18" fill="#2b2b2b"/>
    <rect x="344" y="176" width="88" height="18" fill="#2b2b2b"/>
    <g>
      <rect x="60" y="158" width="26" height="18" fill="#d4d4d4"/>
      <rect x="66" y="164" width="6" height="6" fill="#101010"/>
      <rect x="78" y="164" width="6" height="6" fill="#101010"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;66 0;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <circle cx="232" cy="86" r="11" fill="#d4d4d4" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="296" cy="86" r="11" fill="#d4d4d4" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="86" r="11" fill="#d4d4d4" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="40" y="60" width="16" height="16" fill="#9ca3af"/>
    <rect x="28" y="72" width="40" height="16" fill="#9ca3af"/>
    <rect x="40" y="88" width="16" height="16" fill="#9ca3af"/>
    <rect x="78" y="70" width="10" height="10" fill="#d4d4d4">
      <animate attributeName="y" values="70;58;70" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="70" width="12" height="12" fill="#d4d4d4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
