<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="480" height="270" rx="16"/></clipPath>
    <clipPath id="l1"><rect x="34" y="68" width="160" height="24"><animate attributeName="width" values="160;268;268;160" keyTimes="0;0.3;0.85;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="34" y="104" width="190" height="24"><animate attributeName="width" values="190;312;312;190" keyTimes="0;0.4;0.85;1" dur="9s" begin="0.6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="34" y="140" width="130" height="24"><animate attributeName="width" values="130;214;214;130" keyTimes="0;0.5;0.85;1" dur="9s" begin="1.2s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="34" y="176" width="170" height="24"><animate attributeName="width" values="170;286;286;170" keyTimes="0;0.6;0.85;1" dur="9s" begin="1.8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="480" height="270" fill="#101010"/>
    <rect width="480" height="34" fill="#1a1a1a"/>
    <line x1="0" y1="34" x2="480" y2="34" stroke="#2a2a2a"/>
    <circle cx="20" cy="17" r="4" fill="#ff5f56"/>
    <circle cx="36" cy="17" r="4" fill="#ffbd2e"/>
    <circle cx="52" cy="17" r="4" fill="#27c93f"/>
    <text x="240" y="22" font-family="monospace" font-size="12" fill="#9ca3af" text-anchor="middle">build — zsh</text>
    <g font-family="monospace" font-size="15">
      <text x="34" y="86" fill="#ffffff" clip-path="url(#l1)">$ npm run dev</text>
      <text x="34" y="122" fill="#d4d4d4" clip-path="url(#l2)">&gt; compiling modules...</text>
      <text x="34" y="158" fill="#9ca3af" clip-path="url(#l3)">&gt; ready in 182 ms</text>
      <text x="34" y="194" fill="#ffffff" clip-path="url(#l4)">$ git commit -m "idea"</text>
    </g>
    <rect x="34" y="228" width="9" height="16" fill="#d4d4d4">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="228" width="120" height="4" rx="2" fill="#2f2f2f"/>
  </g>
</svg>
